name: Build and Deploy to Development

on:
  workflow_dispatch:

jobs:
  build-and-deploy-development:
    runs-on: ubuntu-latest
    environment: development
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer

    steps:
      - name: Set Git User
        run: |
          git config --global user.email "prince.francis@tociva.com"
          git config --global user.name "Tociva Technologies"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Enable pnpm
        run: corepack enable

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Increment version
        run: pnpm version patch --no-git-tag-version

      - name: Get branch name
        run: |
          BRANCH_NAME=development
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          VERSION_FULL="v${VERSION}-${BRANCH_NAME}"
          echo "VERSION_FULL=$VERSION_FULL" >> $GITHUB_ENV

      - name: Update versions.md
        run: |
          CURRENT_DATE=$(date +"%Y-%m-%d")
          {
            echo "# Version Details"
            echo "## Version: $VERSION"
            echo "## Date: $CURRENT_DATE"
            echo "BRANCH_NAME=$BRANCH_NAME"
            echo "BUILD_VERSION=$VERSION_FULL"
            echo ""
            cat versions.md
          } > versions.tmp && mv versions.tmp versions.md
      
      - name: Commit and Push Changes
        run: |
          git add package.json
          git add versions.md
          git commit -m "ci: bump version to $VERSION [skip ci]"
          git push origin HEAD:$BRANCH_NAME

      - name: Install dependencies with pnpm
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for prerender
        run: pnpm prerender:chrome

      - name: Build and prerender SEO HTML
        run: pnpm seo

      - name: Verify prerendered HTML
        run: |
          test -f dist/free-invoice-generator/browser/index.html
          test -f dist/free-invoice-generator/browser/home/index.html
          test -f dist/free-invoice-generator/browser/docs/index.html
          test -f dist/free-invoice-generator/browser/docs/create-invoices/index.html
          test -f dist/free-invoice-generator/browser/docs/template-library/index.html
          grep -q 'ng-version' dist/free-invoice-generator/browser/docs/index.html
          grep -q 'Create Professional' dist/free-invoice-generator/browser/index.html

      - name: Add deployment info to info.txt
        run: |
          mkdir -p dist/free-invoice-generator/browser
          echo "branch : $BRANCH_NAME" > dist/free-invoice-generator/browser/info.txt
          echo "version : $VERSION" >> dist/free-invoice-generator/browser/info.txt
          echo "version_full : $VERSION_FULL" >> dist/free-invoice-generator/browser/info.txt
          echo "time : $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> dist/free-invoice-generator/browser/info.txt

      - name: Deploy prerendered build to Cloudflare Pages
        run: |
          pnpm dlx wrangler pages deploy dist/free-invoice-generator/browser \
            --project-name ${{ secrets.CF_PROJECT_NAME }} \
            --branch $BRANCH_NAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Create and Push Tag
        run: |
          TAG_NAME="${{ env.VERSION_FULL }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Get User, Release Date and Time
        run: |
          echo "RELEASE_DATETIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "RELEASE_USER=${{ github.actor }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '${{ env.VERSION_FULL }}'
          name: 'Development Release ${{ env.VERSION_FULL }}'
          body: |
            ## Release Details
            - **Title:** `Development Release ${{ env.VERSION_FULL }}`
            - **Environment:** `Development`
            - **Branch:** `${{ env.BRANCH_NAME }}`
            - **Version:** `${{ env.VERSION }}`
            - **Version Full Name:** `${{ env.VERSION_FULL }}`
            - **Release Date:** `${{ env.RELEASE_DATETIME }}`
            - **Released By:** `${{ env.RELEASE_USER }}`
          draft: false
          prerelease: true


