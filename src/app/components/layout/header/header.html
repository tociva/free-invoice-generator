<header class="app-header site-header">
  <div class="app-header-inner site-header__inner page-container">
    <div class="app-header-brand">
      <a routerLink="/home">Free Invoice Generator <span>by Daybook.Cloud</span></a>
    </div>

    <nav class="app-header-navigation" aria-label="Main navigation">
      <a routerLink="/home" routerLinkActive="app-nav-link--active" ariaCurrentWhenActive="page"
        >Home</a
      >
      <a
        routerLink="/simple-invoice"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        >SimpleInvoice</a
      >
      <a routerLink="/invoice" routerLinkActive="app-nav-link--active" ariaCurrentWhenActive="page"
        >Advanced Invoice</a
      >
      <!-- <a href="https://github.com/tociva/free-invoice-generator" target="_blank" rel="noopener"
        >GitHub</a
      > -->
      <a
        routerLink="/templates"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        >Templates</a
      >
      <!-- <a href="/docs/index.html">Docs</a> -->
    </nav>

    <div class="app-header-actions">
      <div class="app-header-search">
        <tng-button
          size="sm"
          tone="neutral"
          appearance="ghost"
          type="button"
          (click)="openSearch()"
          aria-haspopup="dialog"
          [ariaExpanded]="searchOpen()"
          aria-label="Search"
          [title]="'Search (' + shortcutLabel + ')'"
        >
          <span class="app-header-search-inner">
            <tng-icon icon="search" />
            <span class="app-header-search-label">Search</span>
          </span>
          <kbd class="app-header-search-shortcut">{{ shortcutLabel }}</kbd>
        </tng-button>
      </div>

      <tng-button
        size="sm"
        tone="neutral"
        appearance="ghost"
        class="app-theme-toggle"
        [ariaPressed]="theme.darkMode()"
        [title]="theme.darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggleDarkMode()"
      >
        <tng-icon [icon]="theme.darkMode() ? 'sun' : 'moon'" size="1.25rem" />
      </tng-button>
      <tng-button
        size="sm"
        tone="neutral"
        [ariaExpanded]="menuOpen()"
        ariaControls="mobile-navigation"
        class="app-header-menu"
        (click)="toggleMenu()"
      >
        <span
          class="app-header-menu-glyph"
          [class.app-header-menu-glyph--open]="menuOpen()"
          aria-hidden="true"
        ></span>
        <span class="app-sr-only">Menu</span>
      </tng-button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-navigation"
      class="app-header-mobile page-container"
      aria-label="Mobile navigation"
    >
      <button
        type="button"
        class="app-header-mobile-search-btn"
        (click)="closeMenu(); openSearch()"
      >
        <tng-icon icon="search" />
        <span>Search ({{ shortcutLabel }})</span>
      </button>
      <a
        routerLink="/home"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Home</a
      >
      <a
        routerLink="/simple-invoice"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >SimpleInvoice</a
      >
      <a
        routerLink="/invoice"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Advanced Invoice</a
      >
      <a href="https://github.com/tociva/free-invoice-generator" target="_blank" rel="noopener"
        >GitHub</a
      >
      <a
        routerLink="/templates"
        routerLinkActive="app-nav-link--active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        >Templates</a
      >
      <a href="/docs/index.html" (click)="closeMenu()">Docs</a>
    </nav>
  }
</header>

@if (searchOpen()) {
  <tng-command-palette
    [open]="true"
    [query]="paletteQuery()"
    [options]="filteredResults()"
    placeholder="Search pages, invoice steps..."
    ariaLabel="Global search"
    emptyText="No matching results"
    [getOptionValue]="getOptionValue"
    [getOptionLabel]="getOptionLabel"
    [getOptionDescription]="getOptionDescription"
    (openChange)="onSearchOpenChange($event)"
    (queryChange)="onInputChange($event)"
    (optionSelect)="selectResult($event.option)"
  />
}
