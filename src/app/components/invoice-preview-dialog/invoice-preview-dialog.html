<tng-dialog
  class="invoice-dialog"
  [open]="isOpen()"
  (openChange)="isOpen.set($event)"
  [title]="templateName() || invoiceTitle()"
  [closeOnEscape]="true"
  [closeOnBackdrop]="true"
>
  @if (safeHtml()) {
    <iframe
      [attr.srcdoc]="safeHtml()"
      sandbox="allow-same-origin allow-modals"
      title="Invoice Preview"
      class="app-document-frame"
      style="height: min(75vh, 1123px)"
    ></iframe>
  } @else {
    <p>No invoice preview available</p>
  }
</tng-dialog>
