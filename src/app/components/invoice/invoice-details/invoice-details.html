<tng-card padding="md" class="app-invoice-fields" [formGroup]="InvoiceDetailsForm()">
  <!-- Invoice Number -->
  <div class="app-form-row">
    <label
      for="invoice-details-invoiceNo"
      id="invoice-details-invoiceNo-label"
      class="app-field-label"
      >Invoice Number</label
    >
    <tng-input-field class="app-field" size="sm"
      ><input
        tngInput
        type="text"
        id="invoice-details-invoiceNo"
        formControlName="invoiceNo"
        required
        aria-describedby="invoice-number-error"
        [ariaInvalid]="
          InvoiceDetailsForm().controls.invoiceNo.invalid &&
          InvoiceDetailsForm().controls.invoiceNo.touched
        "
        placeholder="Enter invoice number"
        class="app-field-control"
    /></tng-input-field>
  </div>

  @if (
    InvoiceDetailsForm().controls.invoiceNo.invalid &&
    InvoiceDetailsForm().controls.invoiceNo.touched
  ) {
    <p id="invoice-number-error" role="alert" class="app-form-error">Invoice number is required.</p>
  }
  <!-- Invoice Date and Due Date -->
  <div class="app-form-row">
    <label
      for="invoice-details-invoiceDate"
      id="invoice-details-invoiceDate-label"
      class="app-field-label"
      >Invoice Date</label
    >
    <app-tailng-date
      formControlName="invoiceDate"
      inputId="invoice-details-invoiceDate"
      label="Invoice Date"
    />
  </div>

  <div class="app-form-row">
    <label
      for="invoice-details-invoiceDueDate"
      id="invoice-details-invoiceDueDate-label"
      class="app-field-label"
      >Due Date</label
    >
    <app-tailng-date
      formControlName="invoiceDueDate"
      inputId="invoice-details-invoiceDueDate"
      label="Due Date"
    />
  </div>
  @if (advanced()) {
    <!-- Currency -->
    <div class="app-form-row">
      <label id="invoice-details-currency-label" class="app-field-label">Currency</label>
      <tng-autocomplete
        class="app-field"
        labelId="invoice-details-currency-label"
        placeholder="Search currency..."
        ariaLabel="Currency"
        [options]="filteredCurrencies()"
        [getOptionValue]="currencyValue"
        [getOptionLabel]="currencyLabel"
        [query]="currencyQuery()"
        (queryChange)="currencyQuery.set($event)"
        (openChange)="onCurrencyOpenChange($event)"
        [value]="currencyKeyOf(InvoiceDetailsForm().get('currency')?.value ?? null)"
        (valueChange)="onCurrencyValueChange($event)"
      />
    </div>

    <!-- Decimal Places -->
    <div class="app-form-row">
      <label
        for="invoice-details-decimalPlaces"
        id="invoice-details-decimalPlaces-label"
        class="app-field-label"
        >Decimal Places</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-details-decimalPlaces"
          formControlName="decimalPlaces"
          type="number"
          min="0"
          max="5"
          placeholder="Decimal Places"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Delivery State -->
    <div class="app-form-row">
      <label
        for="invoice-details-deliveryState"
        id="invoice-details-deliveryState-label"
        class="app-field-label"
        >Delivery State</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-details-deliveryState"
          formControlName="deliveryState"
          type="text"
          placeholder="Delivery State"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Tax Option -->
    <div class="app-form-row">
      <label id="invoice-details-taxOption-label" class="app-field-label">Tax Option</label>
      <tng-autocomplete
        class="app-field"
        labelId="invoice-details-taxOption-label"
        placeholder="Search tax option..."
        ariaLabel="Tax Option"
        [options]="filteredTaxOptions()"
        [getOptionValue]="taxValue"
        [getOptionLabel]="taxLabel"
        [query]="taxOptionQuery()"
        (queryChange)="taxOptionQuery.set($event)"
        (openChange)="onTaxOptionOpenChange($event)"
        [value]="taxKeyOf(InvoiceDetailsForm().get('taxOption')?.value ?? null)"
        (valueChange)="onTaxOptionValueChange($event)"
      />
    </div>

    <!-- Show Item Description -->
    <div class="app-form-row">
      <div class="app-field-label">Item Description</div>
      <div class="app-form-options">
        <tng-checkbox tngAngularForms formControlName="hasItemDescription"
          >Show Item Description</tng-checkbox
        >
      </div>
    </div>

    <!-- Show Item Discount -->
    <div class="app-form-row">
      <div class="app-field-label">Item Discount</div>
      <div class="app-form-options">
        <tng-checkbox tngAngularForms formControlName="hasItemDiscount"
          >Show Item Discount</tng-checkbox
        >
      </div>
    </div>

    <!-- Date Format -->
    <div class="app-form-row">
      <label id="invoice-details-dateFormat-label" class="app-field-label">Date Format</label>
      <tng-autocomplete
        class="app-field"
        labelId="invoice-details-dateFormat-label"
        placeholder="Search date format..."
        ariaLabel="Date Format"
        [options]="filteredDateFormats()"
        [getOptionValue]="dateFormatValue"
        [getOptionLabel]="dateFormatLabel"
        [query]="dateFormatQuery()"
        (queryChange)="dateFormatQuery.set($event)"
        (openChange)="onDateFormatOpenChange($event)"
        [value]="dateFormatKeyOf(InvoiceDetailsForm().get('dateFormat')?.value ?? null)"
        (valueChange)="onDateFormatValueChange($event)"
      />
    </div>

    <!-- Account Number -->
    <div class="app-form-row">
      <label
        for="invoice-details-accountNumber"
        id="invoice-details-accountNumber-label"
        class="app-field-label"
        >Account Number</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-details-accountNumber"
          formControlName="accountNumber"
          type="text"
          placeholder="Account Number"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Account Name -->
    <div class="app-form-row">
      <label
        for="invoice-details-accountName"
        id="invoice-details-accountName-label"
        class="app-field-label"
        >Account Name</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-details-accountName"
          formControlName="accountName"
          type="text"
          placeholder="Account Name"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Bank Name -->
    <div class="app-form-row">
      <label
        for="invoice-details-bankName"
        id="invoice-details-bankName-label"
        class="app-field-label"
        >Bank Name</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-details-bankName"
          formControlName="bankName"
          type="text"
          placeholder="Bank Name"
          class="app-field-control"
      /></tng-input-field>
    </div>
  }
</tng-card>
