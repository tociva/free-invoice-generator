<tng-stepper
  ariaLabel="Advanced invoice steps"
  orientation="horizontal"
  [steps]="stepperSteps()"
  [value]="currentStep()"
  (valueChange)="onStepperValueChange($event)"
/>

<!-- STEP CONTENT -->
<div class="app-page">
  @if (currentStep() === 1) {
    <div class="app-invoice-section">
      <div class="app-invoice-columns">
        <!-- Center: My Organization -->
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <app-invoice-organization
              [InvoiceOrganizationForm]="formInvoice.controls.organization"
              [advanced]="true"
            ></app-invoice-organization>
          </div>
        </div>

        <!-- Right Column: Logo Uploads -->
        <div class="app-invoice-aside">
          <div class="app-card-content">
            <div class="app-field">
              <app-invoice-logo
                [InvoiceLogo]="formInvoice"
                [advanced]="true"
                logoField="smallLogo"
                [logoField]="'smallLogo'"
              ></app-invoice-logo>
            </div>
            <div class="app-field">
              <app-invoice-logo
                [InvoiceLogo]="formInvoice"
                [advanced]="true"
                [logoField]="'largeLogo'"
                logoField="largeLogo"
              ></app-invoice-logo>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Button -->
      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation app-invoice-navigation--end">
              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() + 1)"
                [disabled]="isLastStep()"
              >
                <span>Next</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  @if (currentStep() === 2) {
    <div class="app-invoice-section">
      <div class="app-invoice-columns">
        <!-- Center: Customer Details -->
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <app-invoice-customer
              [InvoiceCustomerForm]="formInvoice.controls.customer"
              [advanced]="true"
            ></app-invoice-customer>
          </div>
        </div>
      </div>

      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation">
              <tng-button
                size="sm"
                tone="neutral"
                appearance="outline"
                type="button"
                (click)="goToStep(currentStep() - 1)"
                [disabled]="isFirstStep()"
              >
                <tng-icon icon="chevron-left" />
                <span>Back</span>
              </tng-button>
              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() + 1)"
                [disabled]="isLastStep()"
              >
                <span>Next</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  @if (currentStep() === 3) {
    <div class="app-invoice-section">
      <div class="app-invoice-columns">
        <!-- Center: Invoice Details and Terms -->
        <div class="app-invoice-main">
          <div class="app-invoice-form app-card-content">
            <app-invoice-details
              [InvoiceDetailsForm]="formInvoice"
              [advanced]="true"
            ></app-invoice-details>
            <app-invoice-terms-notes [InvoiceTermsNotes]="formInvoice"></app-invoice-terms-notes>
          </div>
        </div>
      </div>

      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation">
              <tng-button
                size="sm"
                tone="neutral"
                appearance="outline"
                type="button"
                (click)="goToStep(currentStep() - 1)"
                [disabled]="isFirstStep()"
              >
                <tng-icon icon="chevron-left" />
                <span>Back</span>
              </tng-button>

              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() + 1)"
                [disabled]="isLastStep()"
              >
                <span>Next</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  @if (currentStep() === 4) {
    <div class="app-invoice-section">
      <app-invoice-items
        [InvoiceItemForm]="formInvoice.controls.items"
        [advanced]="true"
        [hasItemDescription]="hasItemDescription()"
        [hasItemDiscount]="hasItemDiscount()"
        [selectedTaxOption]="selectedTaxOption()"
      >
      </app-invoice-items>

      <app-invoice-items-mobile
        [InvoiceItemForm]="formInvoice.controls.items"
        [advanced]="true"
        [hasItemDescription]="hasItemDescription()"
        [hasItemDiscount]="hasItemDiscount()"
        [selectedTaxOption]="selectedTaxOption()"
      >
      </app-invoice-items-mobile>

      <app-invoice-summary
        [InvoiceSummary]="formInvoice"
        [advanced]="true"
        [hasItemDiscount]="hasItemDiscount()"
      ></app-invoice-summary>

      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation">
              <tng-button
                size="sm"
                tone="neutral"
                appearance="outline"
                type="button"
                (click)="goToStep(currentStep() - 1)"
                [disabled]="isFirstStep()"
              >
                <tng-icon icon="chevron-left" />
                <span>Back</span>
              </tng-button>

              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() + 1)"
                [disabled]="isLastStep()"
              >
                <span>Next</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  @if (currentStep() === 5) {
    <div class="app-invoice-section">
      <app-select-template
        (templateSelected)="onTemplateSelected($event)"
        [templates]="templates()"
        [selectedTemplate]="selectedTemplate()"
      ></app-select-template>

      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation">
              <tng-button
                size="sm"
                tone="neutral"
                appearance="outline"
                type="button"
                (click)="goToStep(currentStep() - 1)"
                [disabled]="isFirstStep()"
              >
                <tng-icon icon="chevron-left" />
                <span>Back</span>
              </tng-button>

              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() + 1)"
                [disabled]="isLastStep()"
              >
                <span>Next</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
  @if (currentStep() === 6) {
    <div class="app-invoice-section">
      <app-preview-invoice [selectedTemplate]="selectedTemplate()"></app-preview-invoice>

      <div class="app-invoice-columns">
        <div class="app-invoice-main">
          <div class="app-invoice-form">
            <div class="app-invoice-navigation">
              <tng-button
                size="sm"
                tone="neutral"
                appearance="outline"
                type="button"
                (click)="goToStep(currentStep() - 1)"
                [disabled]="isFirstStep()"
              >
                <tng-icon icon="chevron-left" />
                <span>Back</span>
              </tng-button>

              <tng-button
                size="sm"
                tone="primary"
                appearance="solid"
                type="button"
                (click)="goToStep(currentStep() - 5)"
              >
                <span>Finish - Create another Invoice</span>
                <tng-icon icon="chevron-right" />
              </tng-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
