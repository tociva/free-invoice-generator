<div class="app-invoice-logo">
  @if (!uploadedImageUrl()) {
    <app-file-upload
      [fileUploadAccept]="'.png,.jpg,.jpeg,.gif'"
      [deskTopView]="!isMobile() ? 'Tap to Drop your ' + logoField() + ' here' : ''"
      [mobileView]="isMobile() ? 'Tap to Upload ' + logoField() : ''"
      (fileChanged)="onFilesReceived($event)"
      class="app-invoice-logo-upload"
    ></app-file-upload>
  }

  @if (uploadedImageUrl()) {
    <img [src]="uploadedImageUrl()" alt="Uploaded Image" class="app-invoice-logo-image" />

    <tng-button
      size="sm"
      tone="danger"
      appearance="solid"
      type="button"
      (click)="removeImage()"
      class="app-invoice-logo-remove"
    >
      <span aria-hidden="true">✕</span><span class="app-sr-only">Remove logo</span>
    </tng-button>
  }
</div>
