<div class="app-invoice-logo">
  @if (!uploadedImageUrl()) {
    <label
      tngFileUpload
      accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"
      role="button"
      tabindex="0"
      class="app-invoice-logo-upload"
      (filesSelected)="onFilesSelected($event)"
      (filesRejected)="onFilesRejected($event)"
      (keydown.enter)="invoiceLogoUploadInput.click()"
      (keydown.space)="$event.preventDefault(); invoiceLogoUploadInput.click()"
    >
      <input
        #invoiceLogoUploadInput
        type="file"
        accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"
        hidden
        (change)="onFileInputChange($event)"
      />
      <span class="app-invoice-logo-upload-desktop"> Tap to Drop your {{ logoField() }} here </span>
      <span class="app-invoice-logo-upload-mobile"> Tap to Upload {{ logoField() }} </span>
    </label>
  }

  @if (uploadedImageUrl()) {
    <img [src]="uploadedImageUrl()" alt="Uploaded Image" class="app-invoice-logo-image" />

    <tng-button
      size="sm"
      tone="danger"
      appearance="solid"
      type="button"
      (click)="removeImage()"
      class="app-invoice-logo-remove"
    >
      <span aria-hidden="true">✕</span><span class="app-sr-only">Remove logo</span>
    </tng-button>
  }
</div>
