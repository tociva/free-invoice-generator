<div class="app-invoice-logo">
  @if (!uploadedImageUrl()) {
    <label
      tngFileUpload
      accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"
      role="button"
      tabindex="0"
      class="app-invoice-logo-upload"
      (filesSelected)="onFilesSelected($event)"
      (filesRejected)="onFilesRejected($event)"
      (keydown.enter)="invoiceLogoUploadInput.click()"
      (keydown.space)="$event.preventDefault(); invoiceLogoUploadInput.click()"
    >
      <input
        #invoiceLogoUploadInput
        type="file"
        accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"
        hidden
        (change)="onFileInputChange($event)"
      />
      <span class="app-invoice-logo-upload-icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg>
      </span>
      <span class="app-invoice-logo-upload-desktop"> Tap to drop or click to upload </span>
      <span class="app-invoice-logo-upload-mobile"> Tap to upload </span>
      <span class="app-invoice-logo-upload-hint">PNG, JPG or GIF</span>
    </label>
  }

  @if (uploadedImageUrl()) {
    <img [src]="uploadedImageUrl()" alt="Uploaded logo" class="app-invoice-logo-image" />

    <div class="app-invoice-logo-remove-wrap">
      <tng-button size="sm" tone="danger" appearance="solid" type="button" (click)="removeImage()">
        <span aria-hidden="true">✕</span><span class="app-sr-only">Remove logo</span>
      </tng-button>
    </div>
  }
</div>
