<div class="app-preview">
  <!-- Preview Content -->
  <div class="app-preview-content">
    <tng-card padding="none" class="app-preview-card">
      <!-- Header with Template Name and Action Buttons -->
      <div class="app-preview-toolbar">
        <div class="app-page-heading">
          <!-- Left: Template Name -->
          <div>
            <h1 class="app-preview-title">
              {{ selectedTemplate()?.name || 'Coral Breeze' }}
            </h1>
          </div>

          <!-- Right: Action Buttons -->
          <div class="app-actions">
            <!-- Print Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handlePrint()"
              title="Print"
            >
              <tng-icon icon="printer" />
              <span class="app-export-label">Print</span>
            </tng-button>

            <!-- PDF Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadPDF(selectedTemplate())"
              title="Download PDF"
            >
              <tng-icon icon="file-text" />
              <span class="app-export-label">PDF</span>
            </tng-button>

            <!-- JSON Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadJSON()"
              title="Download JSON"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">{{ '{' }} {{ '}' }} JSON</span>
            </tng-button>

            <!-- HTML Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadHTML(selectedTemplate())"
              title="Download HTML"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">HTML</span>
            </tng-button>

            <!-- Code Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleViewCode()"
              title="View Code"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">&lt; &gt; Code</span>
            </tng-button>
          </div>
        </div>
      </div>

      <!-- Invoice Preview Container -->
      <div class="app-preview-canvas">
        <div #previewViewport class="app-preview-viewport">
          <div
            class="app-preview-paper"
            [style.width.px]="scaledWidth()"
            [style.height.px]="scaledHeight()"
          >
            <div
              class="app-preview-transform"
              [style.transform]="'scale(' + previewScale() + ')'"
              [style.width.px]="baseWidth"
              [style.height.px]="baseHeight"
            >
              <iframe
                sandbox="allow-same-origin allow-modals"
                title="Invoice preview"
                [attr.srcdoc]="previewHtml()"
                class="app-document-frame"
                frameborder="0"
              ></iframe>
            </div>
          </div>
        </div>
      </div>
    </tng-card>
  </div>
</div>
