<div class="app-preview">
  <!-- Preview Content -->
  <div class="app-preview-content">
    <tng-card padding="none">
      <!-- Toolbar Header -->
      <header class="app-preview-toolbar">
        <div class="app-preview-header-main">
          <div class="app-preview-title-group">
            <h1 class="app-preview-title">Preview &amp; Download</h1>
            <p class="app-preview-description">
              Review your invoice before downloading or printing.
            </p>
          </div>

          <!-- Actions toolbar -->
          <div class="app-actions">
            <!-- Print Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handlePrint()"
              title="Print"
            >
              <tng-icon icon="printer" />
              <span class="app-export-label">Print</span>
            </tng-button>

            <!-- PDF Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadPDF(selectedTemplate())"
              title="PDF"
            >
              <tng-icon icon="file-text" />
              <span class="app-export-label">PDF</span>
            </tng-button>

            <!-- JSON Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadJSON()"
              title="Download JSON"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">{{ '{' }} {{ '}' }} JSON</span>
            </tng-button>

            <!-- HTML Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleDownloadHTML(selectedTemplate())"
              title="Download HTML"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">HTML</span>
            </tng-button>

            <!-- Code Button -->
            <tng-button
              size="sm"
              tone="neutral"
              appearance="outline"
              type="button"
              (click)="handleViewCode()"
              title="View Code"
            >
              <tng-icon icon="file-code" />
              <span class="app-export-label">&lt; &gt; Code</span>
            </tng-button>
          </div>
        </div>
      </header>

      <!-- Invoice Preview Workspace Canvas -->
      <section class="app-preview-canvas" aria-label="Invoice Document Preview">
        <div class="app-preview-document-meta">
          <div class="app-preview-meta-badge">
            <span class="app-preview-meta-dot" aria-hidden="true"></span>
            <span class="app-preview-meta-title">Invoice Preview</span>
          </div>
          <div class="app-preview-meta-details">
            <span class="app-preview-pill app-preview-pill--format">A4 Document</span>
            <span class="app-preview-pill app-preview-pill--template">
              <tng-icon icon="file-text" size="0.75rem" />
              <span>{{ selectedTemplate()?.name || 'Coral Breeze' }}</span>
            </span>
          </div>
        </div>

        <div #previewViewport class="app-preview-viewport">
          <div
            class="app-preview-paper"
            [style.width.px]="scaledWidth()"
            [style.height.px]="scaledHeight()"
          >
            <div
              class="app-preview-transform"
              [style.zoom]="previewScale()"
              [style.width.px]="baseWidth"
              [style.height.px]="baseHeight"
            >
              <iframe
                sandbox="allow-same-origin allow-modals"
                title="Invoice preview"
                [attr.srcdoc]="previewHtml()"
                class="app-document-frame"
                frameborder="0"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </tng-card>
  </div>
</div>
