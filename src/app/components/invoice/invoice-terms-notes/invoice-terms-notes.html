<div class="app-form-grid app-invoice-notes" [formGroup]="InvoiceTermsNotes()">
  <div>
    <label for="invoice-notes" class="app-field-label">Additional Notes</label>
    <tng-input-field class="app-field" size="sm">
      <textarea
        aria-label="Additional Notes"
        tngInput
        id="invoice-notes"
        formControlName="notes"
        class="app-notes-control"
        placeholder="Type additional notes here"
      ></textarea>
    </tng-input-field>
  </div>

  <div>
    <label for="invoice-terms" class="app-field-label">Terms & Conditions</label>
    <tng-input-field class="app-field" size="sm">
      <textarea
        aria-label="Terms & Conditions"
        tngInput
        id="invoice-terms"
        formControlName="terms"
        class="app-notes-control"
        placeholder="Type terms and conditions here"
      ></textarea>
    </tng-input-field>
  </div>
</div>
