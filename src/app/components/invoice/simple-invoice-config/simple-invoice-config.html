<div class="w-full sm:w-44 sm:ml-8 mt-3 sm:mt-0 self-start space-y-4" [formGroup]="InvoiceConfiq()">
  <div>
    <label id="simple-currency-label" class="font-semibold text-sm">Currency</label>
    <app-tailng-select
      formControlName="currency"
      [options]="currencyStore.currencies()"
      labelId="simple-currency-label"
    />
  </div>
  <div>
    <label id="simple-format-label" class="font-semibold text-sm">Date Format</label>
    <app-tailng-select
      formControlName="dateFormat"
      [options]="dateFormatStore.dateFormat()"
      labelId="simple-format-label"
    />
  </div>
</div>
