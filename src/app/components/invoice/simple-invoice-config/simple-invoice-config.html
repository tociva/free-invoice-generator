<div class="app-invoice-config" [formGroup]="InvoiceConfiq()">
  <div>
    <label id="simple-currency-label" class="app-field-label">Currency</label>
    <app-tailng-select
      formControlName="currency"
      [options]="currencyStore.currencies()"
      labelId="simple-currency-label"
    />
  </div>
  <div>
    <label id="simple-format-label" class="app-field-label">Date Format</label>
    <app-tailng-select
      formControlName="dateFormat"
      [options]="dateFormatStore.dateFormat()"
      labelId="simple-format-label"
    />
  </div>
</div>
