<tng-card padding="md" class="app-invoice-fields" [formGroup]="InvoiceCustomerForm()">
  <!-- Customer Name -->
  <div class="app-form-row">
    <label for="invoice-customer-name" id="invoice-customer-name-label" class="app-field-label"
      >Customer Name</label
    >
    <tng-input-field class="app-field" size="sm"
      ><input
        tngInput
        id="invoice-customer-name"
        formControlName="name"
        placeholder="Customer name"
        class="app-field-control"
    /></tng-input-field>
  </div>

  <!-- Address -->
  <div class="app-form-row">
    <label
      for="invoice-customer-address"
      id="invoice-customer-address-label"
      class="app-field-label"
      >Address</label
    >
    <tng-input-field class="app-field" size="sm">
      <textarea
        tngInput
        id="invoice-customer-address"
        formControlName="address"
        placeholder="Customer address"
        rows="2"
        class="app-field-control app-notes-control"
      ></textarea>
    </tng-input-field>
  </div>

  @if (advanced()) {
    <!-- Country -->
    <div class="app-form-row">
      <label id="invoice-customer-country-label" class="app-field-label">Country</label>
      <tng-autocomplete
        class="app-field"
        labelId="invoice-customer-country-label"
        placeholder="Search country..."
        ariaLabel="Country"
        [options]="filteredCountries()"
        [getOptionValue]="countryValue"
        [getOptionLabel]="countryLabel"
        [query]="countryQuery()"
        (queryChange)="countryQuery.set($event)"
        (openChange)="onCountryOpenChange($event)"
        [value]="countryKeyOf(InvoiceCustomerForm().get('country')?.value ?? null)"
        (valueChange)="onCountryValueChange($event)"
      >
        <ng-template
          #tngAutocompleteOptionTpl
          let-option="option"
          let-label="label"
        >
          <span class="country-option">
            <span
              [class]="countryFlagClass(option)"
              aria-hidden="true"
            ></span>
            <span class="country-option-label">{{ label }}</span>
          </span>
        </ng-template>

        <ng-template #tngAutocompleteSelectedTpl let-option="option">
          <span
            [class]="countryFlagClass(option)"
            aria-hidden="true"
          ></span>
        </ng-template>
      </tng-autocomplete>
    </div>

    <!-- Mobile -->
    <div class="app-form-row">
      <label for="invoice-customer-phone" id="invoice-customer-phone-label" class="app-field-label"
        >Mobile</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-customer-phone"
          formControlName="phone"
          placeholder="Customer Phone Number"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Email ID -->
    <div class="app-form-row">
      <label for="invoice-customer-email" id="invoice-customer-email-label" class="app-field-label"
        >Email ID</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-customer-email"
          formControlName="email"
          placeholder="Customer email"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- GSTIN -->
    <div class="app-form-row">
      <label for="invoice-customer-gstin" id="invoice-customer-gstin-label" class="app-field-label"
        >GSTIN</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-customer-gstin"
          formControlName="gstin"
          placeholder="GSTIN Number"
          class="app-field-control"
      /></tng-input-field>
    </div>
  }
</tng-card>
