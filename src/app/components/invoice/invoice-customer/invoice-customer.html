<div class="card-box" [formGroup]="InvoiceCustomerForm()">
  <!-- Customer Name -->
  <div class="grid grid-cols-[120px_1fr] gap-4 items-center mb-4">
    <label
      for="invoice-customer-name"
      id="invoice-customer-name-label"
      class="text-[1rem] text-gray-500"
      >Customer Name</label
    >
    <tng-input-field class="min-w-0" size="sm"
      ><input
        tngInput
        id="invoice-customer-name"
        formControlName="name"
        placeholder="Customer name"
        class="w-full text-right font-medium outline-none text-sm md:text-base border border-gray-300 rounded px-2 py-1"
    /></tng-input-field>
  </div>

  <!-- Address -->
  <div class="grid grid-cols-[120px_1fr] gap-4 items-start mb-4">
    <label
      for="invoice-customer-address"
      id="invoice-customer-address-label"
      class="text-[1rem] text-gray-500 pt-1"
      >Address</label
    >
    <tng-input-field class="min-w-0" size="sm">
      <textarea
        tngInput
        id="invoice-customer-address"
        formControlName="address"
        placeholder="Customer address"
        rows="2"
        class="w-full text-right font-medium outline-none text-sm md:text-base resize-none border border-gray-300 rounded px-2 py-1"
      ></textarea>
    </tng-input-field>
  </div>

  @if (advanced()) {
    <!-- Country -->
    <div class="grid grid-cols-[120px_1fr] gap-4 items-center mb-4">
      <div class="text-[1rem] text-gray-500">Country</div>
      <div class="relative">
        <tng-input-field class="min-w-0" size="sm"
          ><input
            tngInput
            type="text"
            [value]="getSelectedCountryName()"
            (input)="onCountrySearch($event)"
            (focus)="onInputFocus()"
            (blur)="onInputBlur()"
            placeholder="Search country..."
            class="w-full text-right font-medium outline-none text-sm md:text-base border border-gray-300 rounded px-2 py-1"
        /></tng-input-field>

        @if (countryDropdownOpen()) {
          <div
            class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-300 rounded shadow-lg z-50 max-h-60 overflow-y-auto"
          >
            @if (filteredCountries().length > 0) {
              @for (country of filteredCountries(); track country.code) {
                <div
                  class="px-3 py-2 text-sm hover:bg-gray-100 cursor-pointer text-gray-700 transition-colors text-right"
                  (mousedown)="$event.preventDefault(); selectCountry(country)"
                >
                  {{ country.name }}
                </div>
              }
            } @else {
              <div class="px-3 py-2 text-sm text-gray-500 text-center">No countries found</div>
            }
          </div>
        }
      </div>
    </div>

    <!-- Mobile -->
    <div class="grid grid-cols-[120px_1fr] gap-4 items-center mb-4">
      <label
        for="invoice-customer-phone"
        id="invoice-customer-phone-label"
        class="text-[1rem] text-gray-500"
        >Mobile</label
      >
      <tng-input-field class="min-w-0" size="sm"
        ><input
          tngInput
          id="invoice-customer-phone"
          formControlName="phone"
          placeholder="Customer Phone Number"
          class="w-full text-right font-medium outline-none text-sm md:text-base border border-gray-300 rounded px-2 py-1"
      /></tng-input-field>
    </div>

    <!-- Email ID -->
    <div class="grid grid-cols-[120px_1fr] gap-4 items-center mb-4">
      <label
        for="invoice-customer-email"
        id="invoice-customer-email-label"
        class="text-[1rem] text-gray-500"
        >Email ID</label
      >
      <tng-input-field class="min-w-0" size="sm"
        ><input
          tngInput
          id="invoice-customer-email"
          formControlName="email"
          placeholder="Customer email"
          class="w-full text-right font-medium outline-none text-sm md:text-base border border-gray-300 rounded px-2 py-1"
      /></tng-input-field>
    </div>

    <!-- GSTIN -->
    <div class="grid grid-cols-[120px_1fr] gap-4 items-center mb-4">
      <label
        for="invoice-customer-gstin"
        id="invoice-customer-gstin-label"
        class="text-[1rem] text-gray-500"
        >GSTIN</label
      >
      <tng-input-field class="min-w-0" size="sm"
        ><input
          tngInput
          id="invoice-customer-gstin"
          formControlName="gstin"
          placeholder="GSTIN Number"
          class="w-full text-right font-medium outline-none text-sm md:text-base border border-gray-300 rounded px-2 py-1"
      /></tng-input-field>
    </div>
  }
</div>
