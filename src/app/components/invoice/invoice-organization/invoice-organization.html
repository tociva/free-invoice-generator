<tng-card padding="md" class="app-invoice-fields" [formGroup]="InvoiceOrganizationForm()">
  <!-- My Name -->
  <div class="app-form-row">
    <label
      for="invoice-organization-name"
      id="invoice-organization-name-label"
      class="app-field-label"
      >My Name</label
    >
    <tng-input-field class="app-field" size="sm"
      ><input
        tngInput
        id="invoice-organization-name"
        formControlName="name"
        placeholder="My name"
        class="app-field-control"
    /></tng-input-field>
  </div>

  <!-- My Address -->
  <div class="app-form-row">
    <label
      for="invoice-organization-address"
      id="invoice-organization-address-label"
      class="app-field-label"
      >My Address</label
    >
    <tng-input-field class="app-field" size="sm">
      <textarea
        tngInput
        id="invoice-organization-address"
        formControlName="address"
        placeholder="My address"
        rows="2"
        class="app-field-control app-notes-control"
      ></textarea>
    </tng-input-field>
  </div>

  @if (advanced()) {
    <!-- Country -->
    <div class="app-form-row">
      <div class="app-field-label">Country</div>
      <div class="app-country-search">
        <tng-input-field class="app-field" size="sm"
          ><input
            tngInput
            type="text"
            [value]="getSelectedCountryName()"
            (input)="onCountrySearch($event)"
            (focus)="onInputFocus()"
            (blur)="onInputBlur()"
            aria-label="Country"
            placeholder="Search country..."
            class="app-field-control"
        /></tng-input-field>

        @if (countryDropdownOpen()) {
          <div class="app-suggestions">
            @if (filteredCountries().length > 0) {
              @for (country of filteredCountries(); track country.code) {
                <div
                  class="app-suggestion"
                  role="button"
                  tabindex="0"
                  (keydown.enter)="selectCountry(country)"
                  (keydown.space)="$event.preventDefault(); selectCountry(country)"
                  (mousedown)="$event.preventDefault(); selectCountry(country)"
                >
                  {{ country.name }}
                </div>
              }
            } @else {
              <div class="app-supporting-text">No countries found</div>
            }
          </div>
        }
      </div>
    </div>

    <!-- Email -->
    <div class="app-form-row">
      <label
        for="invoice-organization-email"
        id="invoice-organization-email-label"
        class="app-field-label"
        >Email</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-organization-email"
          formControlName="email"
          placeholder="OrganizationForm email Number"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Mobile -->
    <div class="app-form-row">
      <label
        for="invoice-organization-phone"
        id="invoice-organization-phone-label"
        class="app-field-label"
        >Mobile</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-organization-phone"
          formControlName="phone"
          placeholder="OrganizationForm Phone Number"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- GSTIN -->
    <div class="app-form-row">
      <label
        for="invoice-organization-gstin"
        id="invoice-organization-gstin-label"
        class="app-field-label"
        >GSTIN</label
      >
      <tng-input-field class="app-field" size="sm"
        ><input
          tngInput
          id="invoice-organization-gstin"
          formControlName="gstin"
          placeholder="OrganizationForm gstin Number"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Authority Name -->
    <div class="app-form-row">
      <div class="app-form-options">
        <label for="organization-authorityName" class="app-field-label">Authority</label>
        <!-- Tooltip Icon -->
        <tng-tooltip text="Authority Name" triggerLabel="About authority name" />
      </div>
      <tng-input-field class="app-field" size="sm"
        ><input
          aria-label="Authority Name"
          tngInput
          id="organization-authorityName"
          formControlName="authorityName"
          placeholder="Authority Name"
          class="app-field-control"
      /></tng-input-field>
    </div>

    <!-- Authority Designation -->
    <div class="app-form-row">
      <div class="app-form-options">
        <label for="organization-authorityDesignation" class="app-field-label">Designation</label>
        <!-- Tooltip Icon -->
        <tng-tooltip text="Authority Designation" triggerLabel="About authority designation" />
      </div>
      <tng-input-field class="app-field" size="sm"
        ><input
          aria-label="Authority Designation"
          tngInput
          id="organization-authorityDesignation"
          formControlName="authorityDesignation"
          placeholder="Authority Designation"
          class="app-field-control"
      /></tng-input-field>
    </div>
  }
</tng-card>
