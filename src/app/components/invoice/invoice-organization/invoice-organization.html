<section class="org-section">
  @if (showSectionLabel()) {
    <div class="org-section-label">{{ advanced() ? 'Organization Information' : 'From' }}</div>
  }

  <div class="org-form-grid" [formGroup]="InvoiceOrganizationForm()">
    <div
      [ngClass]="
        advanced() ? 'org-field-wrapper org-field-half' : 'org-field-wrapper org-field-full'
      "
    >
      <label
        for="invoice-organization-name"
        id="invoice-organization-name-label"
        class="org-field-label"
        >{{ advanced() ? 'My Name' : 'Organization Name' }}</label
      >
      <div class="org-field-input-row">
        <div class="org-field-control-wrap">
          <tng-input-field size="sm">
            <input
              tngInput
              id="invoice-organization-name"
              formControlName="name"
              placeholder="Organization name"
              class="app-field-control"
            />
          </tng-input-field>
        </div>
      </div>
    </div>

    @if (advanced()) {
      <div class="org-field-wrapper org-field-half">
        <label id="invoice-organization-country-label" class="org-field-label">Country</label>
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-autocomplete
              labelId="invoice-organization-country-label"
              placeholder="Search country..."
              ariaLabel="Country"
              [options]="filteredCountries()"
              [getOptionValue]="countryValue"
              [getOptionLabel]="countryLabel"
              [query]="countryQuery()"
              (queryChange)="countryQuery.set($event)"
              (openChange)="onCountryOpenChange($event)"
              [value]="countryKeyOf(InvoiceOrganizationForm().get('country')?.value ?? null)"
              (valueChange)="onCountryValueChange($event)"
            >
              <ng-template #tngAutocompleteOptionTpl let-option="option" let-label="label">
                <span class="country-option">
                  <span [class]="countryFlagClass(option)" aria-hidden="true"></span>
                  <span class="country-option-label">{{ label }}</span>
                </span>
              </ng-template>

              <ng-template #tngAutocompleteSelectedTpl let-option="option">
                <span [class]="countryFlagClass(option)" aria-hidden="true"></span>
              </ng-template>
            </tng-autocomplete>
          </div>
        </div>
      </div>
    }

    <div class="org-field-wrapper org-field-full">
      <label
        for="invoice-organization-address"
        id="invoice-organization-address-label"
        class="org-field-label"
        >Organization Address</label
      >
      <div class="org-field-input-row">
        <div class="org-field-control-wrap">
          <tng-input-field size="sm">
            <textarea
              tngInput
              id="invoice-organization-address"
              formControlName="address"
              placeholder="Organization address"
              rows="2"
              class="app-field-control org-address-compact"
            ></textarea>
          </tng-input-field>
        </div>
      </div>
    </div>

    @if (advanced()) {
      <div class="org-field-wrapper org-field-half">
        <label
          for="invoice-organization-email"
          id="invoice-organization-email-label"
          class="org-field-label"
          >Email</label
        >
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-input-field size="sm">
              <input
                tngInput
                id="invoice-organization-email"
                formControlName="email"
                placeholder="Email address"
                class="app-field-control"
              />
            </tng-input-field>
          </div>
        </div>
      </div>

      <div class="org-field-wrapper org-field-half">
        <label
          for="invoice-organization-phone"
          id="invoice-organization-phone-label"
          class="org-field-label"
          >Mobile</label
        >
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-input-field size="sm">
              <input
                tngInput
                id="invoice-organization-phone"
                formControlName="phone"
                placeholder="Phone number"
                class="app-field-control"
              />
            </tng-input-field>
          </div>
        </div>
      </div>

      <div class="org-field-wrapper org-field-half">
        <label
          for="invoice-organization-gstin"
          id="invoice-organization-gstin-label"
          class="org-field-label"
          >GSTIN</label
        >
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-input-field size="sm">
              <input
                tngInput
                id="invoice-organization-gstin"
                formControlName="gstin"
                placeholder="GSTIN number"
                class="app-field-control"
              />
            </tng-input-field>
          </div>
        </div>
      </div>

      <div class="org-field-wrapper org-field-half">
        <div class="org-field-label-row">
          <label for="organization-authorityName" class="org-field-label">Authority</label>
          <tng-tooltip text="Authority Name" ariaLabel="About authority name">
            <tng-icon trigger icon="circle-help" size="0.875rem" />
          </tng-tooltip>
        </div>
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-input-field size="sm">
              <input
                aria-label="Authority Name"
                tngInput
                id="organization-authorityName"
                formControlName="authorityName"
                placeholder="Authority Name"
                class="app-field-control"
              />
            </tng-input-field>
          </div>
        </div>
      </div>

      <div class="org-field-wrapper org-field-half">
        <div class="org-field-label-row">
          <label for="organization-authorityDesignation" class="org-field-label">Designation</label>
          <tng-tooltip text="Authority Designation" ariaLabel="About authority designation">
            <tng-icon trigger icon="circle-help" size="0.875rem" />
          </tng-tooltip>
        </div>
        <div class="org-field-input-row">
          <div class="org-field-control-wrap">
            <tng-input-field size="sm">
              <input
                aria-label="Authority Designation"
                tngInput
                id="organization-authorityDesignation"
                formControlName="authorityDesignation"
                placeholder="Authority Designation"
                class="app-field-control"
              />
            </tng-input-field>
          </div>
        </div>
      </div>
    }
  </div>
</section>
