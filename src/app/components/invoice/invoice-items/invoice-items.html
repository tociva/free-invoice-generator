@if (!isMobile()) {
  <tng-table
    ariaLabel="Invoice items"
    density="compact"
    scrollAxis="x"
    [columns]="tableColumns()"
    [items]="InvoiceItemForm().controls"
  >
    <ng-template tngTableCellTemplate="name" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Item name"
            tngInput
            formControlName="name"
            class="app-field-control"
            placeholder="Enter item name"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="description" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Description"
            tngInput
            formControlName="description"
            class="app-field-control"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="price" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Price"
            tngInput
            formControlName="price"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="quantity" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Quantity"
            tngInput
            formControlName="quantity"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="itemTotal" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Item total"
            tngInput
            formControlName="itemTotal"
            readonly
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="discPercentage" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Discount percentage"
            tngInput
            formControlName="discPercentage"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            placeholder="%"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="discountAmount" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Discount amount"
            tngInput
            formControlName="discountAmount"
            readonly
            placeholder="Value"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="subTotal" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Subtotal"
            tngInput
            formControlName="subTotal"
            readonly
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax1Percentage" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="CGST percentage"
            tngInput
            formControlName="tax1Percentage"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            placeholder="%"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax1Amount" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="CGST value"
            tngInput
            formControlName="tax1Amount"
            readonly
            placeholder="Value"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax2Percentage" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="SGST percentage"
            tngInput
            formControlName="tax2Percentage"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            placeholder="%"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax2Amount" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="SGST value"
            tngInput
            formControlName="tax2Amount"
            readonly
            placeholder="Value"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax3Percentage" let-row="row" let-rowIndex="rowIndex">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="IGST percentage"
            tngInput
            formControlName="tax3Percentage"
            type="number"
            (change)="updateItemTotal(rowIndex)"
            placeholder="%"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="tax3Amount" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="IGST value"
            tngInput
            formControlName="tax3Amount"
            readonly
            placeholder="Value"
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="taxTotal" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Tax total"
            tngInput
            formControlName="taxTotal"
            readonly
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="grandTotal" let-row="row">
      <div [formGroup]="$any(row)">
        <tng-input-field class="app-field" size="sm"
          ><input
            aria-label="Grand total"
            tngInput
            formControlName="grandTotal"
            readonly
            class="app-field-control app-field-control--numeric"
        /></tng-input-field>
      </div>
    </ng-template>

    <ng-template tngTableCellTemplate="action" let-rowIndex="rowIndex">
      <tng-button
        size="sm"
        tone="danger"
        appearance="solid"
        type="button"
        (click)="removeItem(rowIndex)"
      >
        <tng-icon icon="trash" />
        <span class="app-sr-only">Remove item</span>
      </tng-button>
    </ng-template>
  </tng-table>

  <div class="app-item-actions">
    <tng-button size="sm" tone="primary" appearance="solid" type="button" (click)="addItem()">
      <tng-icon icon="plus-circle" /> Add Item
    </tng-button>
  </div>
}
